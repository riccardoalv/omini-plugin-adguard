id: adguard
name: AdGuard Home
version: 0.2.0
protocol: 1
entrypoint: main.py
timeout_s: 60
description: >-
  AdGuard Home DNS servers through their web API: the server (keyed by its
  MAC) and its version, its local DNS names (DNS rewrites), its DHCP
  server's leases, fixed addresses and pool usage when it is on, and recent
  lookups from its query log (to name where devices go). Omini creates,
  changes and removes local DNS names on it.
author: Omini
homepage: https://github.com/riccardoalv/omini-plugin-adguard
changes:
  - dns.set
  - dns.delete
backup: true
fields:
  - key: url
    type: url
    label: Address
    required: true
    help: AdGuard Home's web interface, e.g. http://192.168.1.53:3000 or https://adguard.home.arpa
  - key: username
    type: string
    label: Username
    required: true
    help: A user of AdGuard Home's web interface (the "users" of its configuration).
  - key: password
    type: secret
    label: Password
    required: true
    help: That user's password.
  - key: verify_tls
    type: bool
    label: Verify the TLS certificate
    default: false
    group: Advanced
    help: Turn this on if AdGuard Home's HTTPS certificate is trusted.
  - key: timeout_s
    type: int
    label: Timeout (seconds)
    default: 15
    group: Advanced
    help: How long to wait for each answer of AdGuard Home.
